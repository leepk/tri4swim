services:
  tri4swim:
    build: .
    container_name: tri4swim
    restart: unless-stopped
    env_file:
      - .env
    environment:
      UPLOAD_DIR: /app/uploads
    ports:
      - "6000:3000"
    volumes:
      # Persistent host folder for Admin image uploads.
      - ./uploads:/app/uploads
    # Lets Linux Docker containers reach PostgreSQL running on the host.
    networks:
      - app-network
      
networks:
  app-network:
    external: true